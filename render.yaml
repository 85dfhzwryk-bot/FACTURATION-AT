services:
  - type: web
    name: facturation-at
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./facturation.db
      - key: SECRET_KEY
        generateValue: true
      - key: PDF_STORAGE_PATH
        value: ./storage/bdl
